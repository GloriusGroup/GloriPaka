[project]
name = "gloripaka"
version = "0.1.0"
description = "Sequence-based hydrophobic-interaction-chromatography (HIC) retention prediction for VHH single-domain antibodies (nanobodies)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "F. M. Boser" },
    { name = "N. D. Dobberstein" },
    { name = "M. G. Niedzella" },
    { name = "J. C. Spies", email = "jan.spies@uni-muenster.de" },
]
keywords = [
    "antibody",
    "nanobody",
    "VHH",
    "single-domain-antibody",
    "HIC",
    "hydrophobic-interaction-chromatography",
    "developability",
    "bioinformatics",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "catboost>=1.2",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
# Structure prediction, surface analysis, and IMGT numbering. Reproduces the
# physics composite and the structural / sequence feature families from a raw
# sequence. All model weights are downloaded by the libraries at first use, so
# nothing licensed is vendored.
structure = [
    "ImmuneBuilder>=1.1",   # NanoBodyBuilder2 structure prediction
    "anarcii>=0.1",         # IMGT numbering (pure-Python, no HMMER)
    "freesasa>=2.2",        # solvent-accessible surface area
    "biopython>=1.83",      # sequence utilities and isoelectric point
    "torch>=2.0",           # backend for ImmuneBuilder / anarcii
    "tqdm>=4.66",
]
# DeepSP SAP/SCM surface-patch features (8 of the 40 selected Ridge features).
# DeepSP (Lai Lab, MIT) is declared and cited, not vendored: its Keras weights are
# obtained from the original DeepSP repository. tf-keras keeps the legacy Keras-2
# API used to load the .h5 weights while allowing a modern (Python 3.12, numpy 2) stack.
deepsp = ["tensorflow>=2.17", "tf-keras>=2.17"]
# ESM2 embeddings. NOT used by the shipped model; only needed to rebuild the full
# feature table or run the ESM ablations.
esm = ["fair-esm>=2.0", "torch>=2.0"]
# Everything needed to featurize a raw sequence for the shipped model.
featurize = ["gloripaka[structure,deepsp]"]
# TabPFN is reproducible but license-gated and download-dependent; opt-in backend.
tabpfn = ["tabpfn>=2.0"]
# Documentation site (mkdocs-material + API autodoc).
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# Developer tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gloripaka = "gloripaka.cli:main"

[project.urls]
Homepage = "https://github.com/GloriusGroup/GloriPaka"
Repository = "https://github.com/GloriusGroup/GloriPaka"
Issues = "https://github.com/GloriusGroup/GloriPaka/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gloripaka"]

# --------------------------------------------------------------------------- #
# Tooling                                                                      #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D203/D213 conflict with the Google convention; ignore the alternatives.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]          # tests need not be docstring-complete
"experiments/*" = ["D"]    # experiment scripts document themselves in-module

[tool.mypy]
python_version = "3.11"
packages = ["gloripaka"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
